# Config file for Air in TOML format
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/server/main.go"
bin = "./tmp/main"
full_bin = "APP_ENV=local ./tmp/main"
include_ext = ["go", "tpl", "tmpl", "html", "env", "sql", "hcl"]
exclude_dir = ["assets", "tmp", "vendor", "web"]
include_dir = []
exclude_file = []
exclude_regex = ["_test\\.go"]
exclude_unchanged = false
follow_symlink = false
log = "air.log"
poll = true
poll_interval = 500
delay = 0
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = false
main_only = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
