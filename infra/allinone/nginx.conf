user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off; # the API server logs every request itself
    sendfile on;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # The API rate-limits by client IP, so it gets exactly one address: the peer
    # nginx sees, never a client-supplied X-Forwarded-For (which would let anyone
    # pick a fresh "IP" per request). Behind a TLS proxy, HUMORA_TRUSTED_PROXIES
    # names it, and only then is its X-Forwarded-For used (written at startup).
    include /etc/nginx/humora-realip.conf;

    server {
        listen 8080;
        server_name _;
        root /app/web;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            client_max_body_size 25m; # API BodyLimit
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;          # Pulse realtime gateway
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }

        # Object storage. Browsers use presigned URLs signed for this host, so the Host header must
        # reach MinIO unchanged. Bucket roots only accept presigned POST uploads (Pulse attachments);
        # listing a bucket is never exposed.
        location ~ ^/(humora-media|pulse-media)/?$ {
            limit_except POST { deny all; }
            client_max_body_size 110m;
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
        }

        location ~ ^/(humora-media|pulse-media)/.+ {
            client_max_body_size 110m; # Pulse attachments are capped at 100 MB
            # Uploaded files are served from the app's origin: never let one run as a page.
            # (add_header here replaces the server-level headers, so nosniff is repeated.)
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "sandbox; default-src 'none'" always;
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
